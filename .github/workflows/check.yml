# Format, lint and test on every platform needy builds for, and check that
# the committed generated Protobuf code matches `proto/`.
# The job layout, the concurrency group and the cache policy follow
# moeru-ai/auv's `.github/workflows/check.yml`; action versions are the ones
# auv pins there (checkout@v6, rust-cache@v2, buf-action@v1).
name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A newer push to the same pull request supersedes the older run. Runs on
  # main are never cancelled, so every main commit keeps a complete result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    name: rust ${{ matrix.os }}
    env:
      # NOTICE(ci-disk): a full workspace test build with a restored cache can
      # fill the hosted Ubuntu runner's disk ("No space left on device", seen in
      # moeru-ai/auv). Line tables keep file:line in panics and backtraces but
      # shrink debug info, the bulk of `target/`.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      # NOTICE(ci-disk): the hosted Ubuntu image ships toolchains this job
      # never uses; removing them frees about 20 GB for the build and cache.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # NOTICE(rust-toolchain): `rust-toolchain.toml` pins the toolchain and
      # its components, and rustup (preinstalled on every hosted runner)
      # installs exactly that; a setup action would install a second one that
      # the file then overrides.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show
      # Pull requests only restore the cache; main writes it, so a pull
      # request cannot evict main's entry or poison it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Formatting does not depend on the platform: rustfmt follows every
      # `mod`, whatever its `cfg`.
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # As `make check`. On Linux this also compiles the in-guest init and
      # proxy (`needy-core-actor`'s `guest`, Linux only).
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo run --locked --quiet --bin needy -- --version
      - run: git diff --check

  # The install channels' scripts, as auv's `release-tooling` job. ShellCheck
  # is preinstalled on the hosted Ubuntu image.
  release-tooling:
    name: release tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck --shell=sh install/install.sh
      - run: shellcheck scripts/render-homebrew-formula scripts/tests/render-homebrew-formula
      - run: scripts/tests/render-homebrew-formula

  proto:
    name: proto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The version `.prototools` pins for local development.
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
      # As `make proto`, with the formatter in check mode. `buf.gen.yaml`
      # uses remote BSR plugins, which unauthenticated callers may run within
      # the BSR's rate limit.
      # NOTICE(proto-breaking): no `buf breaking` gate yet: the API is
      # unreleased (0.0.x) and changes freely. Add one against the last
      # release tag once a release promises wire compatibility.
      - name: Lint, format and regenerate
        working-directory: proto
        run: |
          buf lint
          buf format --diff --exit-code
          buf generate
      - name: Verify the generated code is committed
        run: |
          # Include untracked files: a new generated file must be committed too.
          changes=$(git status --porcelain --untracked-files=all -- crates/api-proto/src/gen)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff -- crates/api-proto/src/gen | head -200
            echo "Run make proto and commit the result."
            exit 1
          fi
