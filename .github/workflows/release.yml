# Builds the `needy` binaries, the prebuilt actor images and the container
# images for a release, and on a real release publishes them. The base images
# `actor-base` and `executor-base` come first; the VM files, `needy-actor` and
# `needy-executor` are derived from them
# (docs/ai/references/architecture/2026-11-25-layered-oci-base-spec.md, B1,
# B3 and B6).
# The structure (build matrix, archives with a `.sha256`, a "binary starts"
# check, `workflow_dispatch` with an optional upload to an existing release, a
# `publish` job on `softprops/action-gh-release`) follows moeru-ai/auv's
# `.github/workflows/release.yml`, whose action versions it also uses
# (checkout@v6, upload-artifact@v7, download-artifact@v8,
# action-gh-release@v2, import-codesign-certs@v7). The `docker/*` actions
# are their current majors (setup-buildx v4, build-push v7, login v4) and the
# per-architecture digest merge is Docker's documented multi-platform pattern:
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
#
# A plain `workflow_dispatch` builds and verifies everything and publishes
# nothing: no release assets, no GHCR push, no attestation (unless `attest`
# asks for one).
name: Release

on:
  # NOTICE(release-trigger): `published` fires for releases and prereleases
  # alike. Publishing a prerelease also fires `prereleased`, so listing both
  # (auv lists only `prereleased`) would start two runs that build and upload
  # the same assets.
  # Reference: https://docs.github.com/en/webhooks/webhook-events-and-payloads#release
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: Upload artifacts to an existing GitHub release and push the container images
        required: false
        default: false
        type: boolean
      tag_name:
        description: Existing release tag to upload to when upload_to_release is enabled
        required: false
        type: string
      attest:
        description: Attest the build provenance of the archives without publishing them (a publishing run always does)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # True on a release event, or on a dispatch that asks to upload to a named
  # release. Everything that publishes (GHCR pushes, release assets) checks it.
  PUBLISH: ${{ github.event_name == 'release' || (inputs.upload_to_release && inputs.tag_name != '') }}
  TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
  REGISTRY: ghcr.io/needy-dev
  # The distribution `images/Dockerfile` builds `actor-base` and
  # `executor-base` on, the second half of their tags
  # (`<version>-ubuntu-24.04`, B1 of the layered OCI base spec).
  BASE_DISTRIBUTION: ubuntu-24.04

jobs:
  binary:
    name: needy ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTICE(linux-musl): the Linux binaries are static musl builds, as
          # the `needy` stage of images/Dockerfile already builds the guest
          # and executor binary, so they run on any Linux whatever its glibc
          # and need no old-glibc build container. `musl-tools` gives the C
          # dependencies (`ring`, bundled SQLite) a musl C compiler.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: needy-x86_64-unknown-linux-musl.tar.gz
            executable: needy
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: needy-aarch64-unknown-linux-musl.tar.gz
            executable: needy
          - os: macos-15
            target: aarch64-apple-darwin
            archive: needy-aarch64-apple-darwin.tar.gz
            executable: needy
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: needy-x86_64-apple-darwin.tar.gz
            executable: needy
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: needy-x86_64-pc-windows-msvc.zip
            executable: needy.exe
    steps:
      - uses: actions/checkout@v6

      # NOTICE(rust-toolchain): rustup installs the toolchain
      # `rust-toolchain.toml` pins; see check.yml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # NOTICE(windows-static-crt): MSVC targets link the C runtime dynamically
      # by default, so needy.exe would import VCRUNTIME140.dll, which a fresh
      # Windows install lacks (it comes only with the Visual C++
      # Redistributable; the UCRT api-ms-win-crt-* DLLs ship with Windows 10
      # and later). Copied from moeru-ai/auv's release workflow. It is set for
      # the release build only; the build passes --target, so build scripts
      # keep the default.
      - name: Link the MSVC C runtime statically
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      # TODO(release-signing): needy.exe is not Authenticode-signed: there is
      # no certificate for it. Sign it once the owner has one; an archive
      # alone is not a signing claim.
      - name: Build release binary
        run: cargo build --locked --release --package needy-cli --bin needy --target ${{ matrix.target }}

      # macOS signing and notarization as moeru-ai/auv's release workflow
      # does it, with the same secret names. Every run signs; only a
      # publishing run notarizes (the `notarize-macos` job).
      - name: Import macOS signing certificates
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}

      # NOTICE(hardened-runtime): notarization requires the hardened runtime
      # (`--options runtime`). needy needs no entitlement under it: it maps
      # no writable executable memory, loads no unsigned libraries, and
      # leaves Virtualization.framework to vfkit and Apple's `container`,
      # which it only spawns as child processes and which carry their own
      # entitlements. Add an entitlements plist here if that changes.
      # Reference: https://developer.apple.com/documentation/security/hardened-runtime
      - name: Sign macOS executable
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          test -n "$identity"
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          codesign --force --timestamp --options runtime --sign "$identity" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

      - name: Verify binary starts
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --version

      - name: Verify the Linux binary is static
        if: runner.os == 'Linux'
        run: |
          binary=target/${{ matrix.target }}/release/needy
          file "$binary"
          if readelf -lW "$binary" | grep -q INTERP || readelf -dW "$binary" | grep -q '(NEEDED)'; then
            echo "needy is not statically linked" >&2
            exit 1
          fi

      # Regression guard for NOTICE(windows-static-crt).
      - name: Verify the Windows binary needs no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Host*\*\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $binary = "target/${{ matrix.target }}/release/${{ matrix.executable }}"
          $imports = & $dumpbin /nologo /dependents $binary | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
          $runtime = [regex]::Matches($imports, '(?im)^\s*((vcruntime|msvcp)\S*\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value }
          if ($runtime) { throw "$binary imports the Visual C++ runtime: $($runtime -join ', ')" }
          Write-Host "$binary imports no Visual C++ runtime DLL"

      - name: Create archive
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.executable }}

      - name: Create archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -DestinationPath "${{ matrix.archive }}"

      - name: Calculate hash
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Calculate hash
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Content -Path "${{ matrix.archive }}.sha256" -Value (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          # NOTICE(artifact-retention): workflow artifacts only carry files
          # to the publish job and to whoever checks a dispatch run; the
          # release keeps the published copy. A week keeps the actor images
          # (hundreds of MB each) from piling up in the storage quota.
          retention-days: 7
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  # One job per architecture builds that architecture's base images, VM actor
  # files and container images on one BuildKit builder, so the `needy` stage
  # of images/Dockerfile (a full musl build of needy-cli) is built once and
  # reused, and the derived images reuse the bases' cached layers.
  # Native runners for each architecture; QEMU would emulate the kernel and
  # Rust builds and take hours.
  images:
    name: images ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      # NOTICE(build-record): build-push-action uploads each build's record
      # as a workflow artifact named `<owner>~<repo>~<id>.dockerbuild`, which
      # starts with `needy-` here and is noise among the release artifacts.
      # Reference: https://docs.docker.com/build/ci/github-actions/build-summary/
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Firecracker actor is x86_64 only (images/Dockerfile). The VM
          # images are base images: no needy inside, which the daemon brings
          # as a second disk; their `manifest.json` records the base ABI they
          # speak.
          - os: ubuntu-24.04
            arch: amd64
            vm_target: actor
            vm_driver: linux-firecracker
            vm_arch: x86_64
            vm_archive: needy-actor-linux-firecracker-x86_64.tar.gz
            vm_files: vmlinux rootfs.ext4 firecracker
          # The `macos-vz` actor is arm64 only: Virtualization.framework on
          # Apple silicon boots it.
          - os: ubuntu-24.04-arm
            arch: arm64
            vm_target: actor-macos-vz
            vm_driver: macos-vz
            vm_arch: aarch64
            vm_archive: needy-actor-macos-vz-aarch64.tar.gz
            vm_files: Image initrd rootfs.ext4
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # NOTICE(ci-disk): the kernel tree, the Firecracker and needy target
      # directories, two ext4 root file systems and two images all live in
      # the BuildKit builder at once; the hosted image's unused toolchains
      # are removed to make room (about 20 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      # The needy version of this tree, which names the base images
      # (`<version>-ubuntu-24.04`) and goes in the VM image's manifest.
      - name: Name the images
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          if [ "$PUBLISH" = true ] && [ "$TAG_NAME" != "v$version" ]; then
            echo "::warning::the release tag $TAG_NAME is not v$version, the version of this tree; needy $version pulls from v$version"
          fi
          {
            echo "version=$version"
            echo "actor-base=$REGISTRY/needy/actor-base:$version-$BASE_DISTRIBUTION"
            echo "executor-base=$REGISTRY/needy/executor-base:$version-$BASE_DISTRIBUTION"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Build actor-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: actor-base
          load: true
          tags: actor-base:ci

      - name: Build executor-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: executor-base
          load: true
          tags: executor-base:ci

      # The bases' layers (B1 of the layered OCI base spec): each starts with
      # the distribution's own layers, unchanged (the root `images/Dockerfile`
      # pins, which `actor-base` names in its labels); `actor-base` has
      # exactly two layers above them (the userland and `/.needy`) and no
      # container shims: its shells are the real programs, and the scripts
      # and stubs an image `FROM` it needs are there.
      - name: Verify the base images
        run: |
          set -euo pipefail
          layers() { docker image inspect "$1" --format '{{ range .RootFS.Layers }}{{ println . }}{{ end }}' | sed '/^$/d'; }
          label() { docker image inspect "$1" --format "{{ index .Config.Labels \"$2\" }}"; }
          starts_with() {
            if ! diff <(layers "$1") <(layers "$2" | head -n "$(layers "$1" | wc -l)"); then
              echo "$2 does not start with the layers of $1" >&2; exit 1
            fi
          }
          root="$(label actor-base:ci org.opencontainers.image.base.name)@$(label actor-base:ci org.opencontainers.image.base.digest)"
          test "$root" = "$(label executor-base:ci org.opencontainers.image.base.name)@$(label executor-base:ci org.opencontainers.image.base.digest)"
          docker pull --platform linux/${{ matrix.arch }} "$root"
          starts_with "$root" actor-base:ci
          starts_with "$root" executor-base:ci
          test "$(layers actor-base:ci | wc -l)" -eq "$(( $(layers "$root" | wc -l) + 2 ))"
          test "$(label actor-base:ci needy.base-abi)" = 1
          docker run --rm actor-base:ci /usr/bin/bash --version
          docker run --rm actor-base:ci /bin/sh -c '
            for shell in /usr/bin/sh /usr/bin/bash /usr/bin/dash; do
              if [ "$shell" -ef /.needy/proxy ] || cmp -s "$(readlink -f "$shell")" /.needy/proxy; then
                echo "$shell is a shim" >&2; exit 1
              fi
            done
            test ! -e /.needy/real
            test -x /.needy/init && test -x /.needy/proxy && test -x /.needy/shim-image && test -d /.needy/channels'
          docker run --rm executor-base:ci needy --version
          layers actor-base:ci

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture pushes its images by digest only; the `manifests`
      # job tags the multi-architecture indexes. These builds hit the cache
      # of the builds above, so they only push.
      - name: Push actor-base by digest
        id: push-actor-base
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: actor-base
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/needy/actor-base,push-by-digest=true,name-canonical=true,push=true

      - name: Push executor-base by digest
        id: push-executor-base
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: executor-base
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/needy/executor-base,push-by-digest=true,name-canonical=true,push=true

      # The digest of each base's image manifest for this architecture, which
      # the derived images' labels and the VM image's manifest name. A push
      # with a provenance attestation returns the digest of an index holding
      # the image and its attestation; the `manifests` job merges the image
      # manifests themselves into the published index, so that is the digest
      # a reader finds there.
      - name: Find the bases' digests
        id: base-digests
        if: env.PUBLISH == 'true'
        env:
          ACTOR_BASE_DIGEST: ${{ steps.push-actor-base.outputs.digest }}
          EXECUTOR_BASE_DIGEST: ${{ steps.push-executor-base.outputs.digest }}
        run: |
          set -euo pipefail
          platform_digest() {
            local raw
            raw="$(docker buildx imagetools inspect --raw "$1@$2")"
            if jq -e 'has("manifests")' <<< "$raw" > /dev/null; then
              jq -r --arg arch "${{ matrix.arch }}" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
                | if length == 1 then .[0].digest else error("not one linux/\($arch) manifest") end' <<< "$raw"
            else
              echo "$2"
            fi
          }
          {
            echo "actor-base=$(platform_digest "$REGISTRY/needy/actor-base" "$ACTOR_BASE_DIGEST")"
            echo "executor-base=$(platform_digest "$REGISTRY/needy/executor-base" "$EXECUTOR_BASE_DIGEST")"
          } | tee -a "$GITHUB_OUTPUT"

      # The VM actor's files, exported as images/Dockerfile's header shows
      # (`--output type=local`). `needy image build --out` builds the same target
      # through the Docker API, but picks it from the host it runs on (the
      # Firecracker target on any Linux), so it cannot build the `macos-vz`
      # files on a Linux runner. The kernel is built without a recipe, so it
      # keeps its own `uname` identity; `needy image build --recipe` rebuilds it
      # with a recipe's.
      - name: Build the ${{ matrix.vm_target }} actor files
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: ${{ matrix.vm_target }}
          outputs: type=local,dest=vm

      # `actor-base` again, after the VM files: the same image ID shows the
      # VM build derived its root file system from the `actor-base` verified
      # (and pushed) above, not from a rebuild of its stages, so the layers
      # the manifest records are the ones it holds.
      - name: Rebuild actor-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: actor-base
          load: true
          tags: actor-base:after-vm

      - name: Verify the actor files
        run: |
          ls -lsh vm
          for file in ${{ matrix.vm_files }} base-abi; do test -s "vm/$file"; done
          echo "base ABI $(cat vm/base-abi)"
          if [ -e vm/firecracker ]; then vm/firecracker --version; fi
          sudo e2fsck -fn vm/rootfs.ext4
          test "$(docker image inspect actor-base:ci --format '{{ .Id }}')" = "$(docker image inspect actor-base:after-vm --format '{{ .Id }}')"

      # The image's `manifest.json`, in the shape `needy image pull` reads
      # (`needy_core_actor::image::manifest`, whose tests
      # `the_manifest_of_a_release_archive_has_no_source_or_sha256` and
      # `the_manifest_of_a_release_archive_records_its_base` hold the same
      # fields): the needy version of this tree, the driver, the architecture,
      # the base ABI the Dockerfile exported as `base-abi`, which the manifest
      # replaces, and the `actor-base` its root file system was derived from:
      # the published name, the DiffIDs of its layers and, when this run
      # pushed it, its digest. `needy image pull` adds where it came from and
      # the archive's SHA-256.
      - name: Write the image's manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BASE_IMAGE: ${{ steps.meta.outputs.actor-base }}
          BASE_DIGEST: ${{ steps.base-digests.outputs.actor-base }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" --arg driver "${{ matrix.vm_driver }}" --arg arch "${{ matrix.vm_arch }}" \
            --argjson base_abi "$(cat vm/base-abi)" \
            --arg base_image "$BASE_IMAGE" --arg base_digest "$BASE_DIGEST" \
            --argjson diff_ids "$(docker image inspect actor-base:ci --format '{{ json .RootFS.Layers }}')" \
            '{version: $version, driver: $driver, arch: $arch, base_abi: $base_abi,
              base: ({image: $base_image, diff_ids: $diff_ids} + (if $base_digest == "" then {} else {digest: $base_digest} end))}' \
            > vm/manifest.json
          rm vm/base-abi
          cat vm/manifest.json

      # `--sparse` keeps the free blocks of rootfs.ext4 out of the archive;
      # GNU tar recreates them as holes on extraction, and `needy image pull`
      # writes them back as holes.
      - name: Archive the actor files
        run: |
          tar --sparse -czf ${{ matrix.vm_archive }} -C vm ${{ matrix.vm_files }} manifest.json
          sha256sum ${{ matrix.vm_archive }} | awk '{ print $1 }' > ${{ matrix.vm_archive }}.sha256
          ls -lh ${{ matrix.vm_archive }}
          sudo rm -rf vm

      - name: Upload the actor files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.vm_archive }}
          # See NOTICE(artifact-retention) above. The archive is already
          # gzip-compressed.
          retention-days: 7
          compression-level: 0
          path: |
            ${{ matrix.vm_archive }}
            ${{ matrix.vm_archive }}.sha256

      # The compatibility images (B6 of the layered OCI base spec), derived
      # from the bases built above, whose names their labels carry.
      # TODO(base-images): stop building and publishing `needy-actor` and
      # `needy-executor` once a release has shipped `actor-base` and
      # `executor-base` and the docs and examples use them.
      - name: Build needy-actor
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: actor-container
          load: true
          tags: needy-actor:ci
          build-args: BASE_NAME=${{ steps.meta.outputs.actor-base }}

      - name: Build needy-executor
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: executor
          load: true
          tags: needy-executor:ci
          build-args: BASE_NAME=${{ steps.meta.outputs.executor-base }}

      # The guest needy the daemon injects into actors, from the `needy`
      # stage the builds above already built.
      - name: Build the guest needy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: guest
          outputs: type=local,dest=guest

      # needy-actor is a base image: its shims (every program on PATH, a
      # link to the shim stub) hand an exec to the guest needy, which the
      # daemon injects with a read-only bind mount. Without it (an image
      # `FROM` the base being built) a shim runs its real program, and the
      # proxy itself, which stands for no program, fails with the stub's
      # message. The actor's entrypoint is the boot stub, which needs a run,
      # so a shim and the guest needy are started directly.
      - name: Verify the container images start
        run: |
          set -euo pipefail
          test "$(docker image inspect needy-actor:ci --format '{{ index .Config.Labels "needy.base-abi" }}')" = 1
          docker run --rm --entrypoint /usr/bin/true needy-actor:ci
          if docker run --rm --entrypoint /.needy/proxy needy-actor:ci 2> stub.err; then
            echo "the proxy ran without the guest needy" >&2; exit 1
          fi
          cat stub.err
          grep -q "the daemon did not inject the guest needy" stub.err
          docker run --rm --entrypoint /bin/sh needy-actor:ci -c 'test -x /.needy/shim-image'
          docker run --rm -v "$PWD/guest/needy:/.needy/needy:ro" --entrypoint /.needy/needy needy-actor:ci --version
          docker run --rm -v "$PWD/guest/needy:/.needy/needy:ro" --entrypoint /usr/bin/true needy-actor:ci
          docker run --rm needy-executor:ci needy --version
          docker image ls

      # `needy-actor` is `actor-base` and exactly one layer, the shim step,
      # whose shells are shims; `needy-executor` has `executor-base`'s layers.
      # Each label names the base it comes from.
      - name: Verify the compatibility images derive from the bases
        env:
          ACTOR_BASE: ${{ steps.meta.outputs.actor-base }}
          EXECUTOR_BASE: ${{ steps.meta.outputs.executor-base }}
        run: |
          set -euo pipefail
          layers() { docker image inspect "$1" --format '{{ range .RootFS.Layers }}{{ println . }}{{ end }}' | sed '/^$/d'; }
          label() { docker image inspect "$1" --format "{{ index .Config.Labels \"$2\" }}"; }
          if ! diff <(layers actor-base:ci) <(layers needy-actor:ci | head -n "$(layers actor-base:ci | wc -l)"); then
            echo "needy-actor does not start with the layers of actor-base" >&2; exit 1
          fi
          test "$(layers needy-actor:ci | wc -l)" -eq "$(( $(layers actor-base:ci | wc -l) + 1 ))"
          diff <(layers executor-base:ci) <(layers needy-executor:ci)
          test "$(label needy-actor:ci org.opencontainers.image.base.name)" = "$ACTOR_BASE"
          test "$(label needy-executor:ci org.opencontainers.image.base.name)" = "$EXECUTOR_BASE"
          # NOTICE: compare contents, not inodes. The shims are made in a layer
          # above the one holding /.needy/proxy, and a hard link cannot span
          # layers, so a shim is a copy of the proxy rather than a link to it
          # once the image is assembled (docker-container builder, `load`).
          docker run --rm --entrypoint /bin/sh needy-actor:ci -c 'cmp -s /usr/bin/bash /.needy/proxy && test -x /.needy/real/usr/bin/bash'

      - name: Push needy-actor by digest
        id: push-actor
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: actor-container
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BASE_NAME=${{ steps.meta.outputs.actor-base }}
            BASE_DIGEST=${{ steps.base-digests.outputs.actor-base }}
          outputs: type=image,name=${{ env.REGISTRY }}/needy-actor,push-by-digest=true,name-canonical=true,push=true

      - name: Push needy-executor by digest
        id: push-executor
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: executor
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BASE_NAME=${{ steps.meta.outputs.executor-base }}
            BASE_DIGEST=${{ steps.base-digests.outputs.executor-base }}
          outputs: type=image,name=${{ env.REGISTRY }}/needy-executor,push-by-digest=true,name-canonical=true,push=true

      - name: Record the digests
        if: env.PUBLISH == 'true'
        env:
          ACTOR_DIGEST: ${{ steps.push-actor.outputs.digest }}
          EXECUTOR_DIGEST: ${{ steps.push-executor.outputs.digest }}
          ACTOR_BASE_DIGEST: ${{ steps.push-actor-base.outputs.digest }}
          EXECUTOR_BASE_DIGEST: ${{ steps.push-executor-base.outputs.digest }}
        run: |
          mkdir -p digests/needy-actor digests/needy-executor digests/needy/actor-base digests/needy/executor-base
          touch "digests/needy-actor/${ACTOR_DIGEST#sha256:}" "digests/needy-executor/${EXECUTOR_DIGEST#sha256:}"
          touch "digests/needy/actor-base/${ACTOR_BASE_DIGEST#sha256:}" "digests/needy/executor-base/${EXECUTOR_BASE_DIGEST#sha256:}"

      - name: Upload the digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          retention-days: 1
          path: digests

  manifests:
    name: container manifests
    needs: images
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release && inputs.tag_name != '')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # For the version in Cargo.toml, which names the base images as the
      # `images` job did.
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags `needy-actor` and `needy-executor` with the release tag and
      # `latest`. needy publishes every release as a prerelease while it is
      # 0.0.x, so `latest` follows the newest release of either kind. The
      # bases are tagged `<version>-ubuntu-24.04` only: profiles and `FROM`
      # lines pin their digest, and the tag is for people (B1 of the layered
      # OCI base spec).
      - name: Create the multi-architecture manifests
        id: indexes
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          index() {
            local image=$1 tag
            shift
            local sources=() tags=()
            for digest in digests/"$image"/*; do
              sources+=("$REGISTRY/$image@sha256:$(basename "$digest")")
            done
            for tag in "$@"; do
              tags+=(-t "$REGISTRY/$image:$tag")
            done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$REGISTRY/$image:$1"
          }
          # TODO(base-images): drop these two once the bases replace them (B6).
          for image in needy-actor needy-executor; do
            index "$image" "$TAG_NAME" latest
          done
          for base in actor-base executor-base; do
            tag="$version-$BASE_DISTRIBUTION"
            index "needy/$base" "$tag"
            echo "$base=$(docker buildx imagetools inspect "$REGISTRY/needy/$base:$tag" --format '{{ json .Manifest }}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          done

      # A GitHub artifact attestation of each base's index, pushed next to it,
      # which `gh attestation verify oci://ghcr.io/needy-dev/needy/actor-base@DIGEST
      # -R needy-dev/needy` checks; the BuildKit provenance the pushes above
      # attach stays in the index as for every image here.
      # Reference: https://github.com/actions/attest-build-provenance/tree/v4#container-image
      - name: Attest the build provenance of actor-base
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/needy/actor-base
          subject-digest: ${{ steps.indexes.outputs.actor-base }}
          push-to-registry: true

      - name: Attest the build provenance of executor-base
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/needy/executor-base
          subject-digest: ${{ steps.indexes.outputs.executor-base }}
          push-to-registry: true

  # The arm64 macOS archive carries the guest needy its daemon injects into
  # actors, which run arm64 Linux on Apple silicon: the static
  # aarch64-unknown-linux-musl needy of the same run, as
  # `needy-linux-aarch64` next to `needy`. The Intel archive gets none: no
  # actor driver runs on an Intel Mac.
  # NOTICE(guest-signing): the guest needy is a Linux ELF that macOS never
  # runs, so it is not code-signed or notarized (`codesign` and the notary
  # service sign Mach-O code); the archive's `.sha256` and its build
  # provenance attestation (the `attest` job) cover it.
  macos-guest:
    name: macOS archive with the guest needy
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: needy-aarch64-unknown-linux-musl.tar.gz
          path: linux

      - uses: actions/download-artifact@v8
        with:
          name: needy-aarch64-apple-darwin.tar.gz
          path: macos

      - name: Add needy-linux-aarch64 to the archive
        run: |
          set -euo pipefail
          mkdir pack
          tar -xzf macos/needy-aarch64-apple-darwin.tar.gz -C pack
          tar -xzf linux/needy-aarch64-unknown-linux-musl.tar.gz -C linux
          install -m 0755 linux/needy pack/needy-linux-aarch64
          file pack/needy-linux-aarch64
          readelf -hW pack/needy-linux-aarch64 | grep -q 'Machine:.*AArch64'
          if readelf -lW pack/needy-linux-aarch64 | grep -q INTERP || readelf -dW pack/needy-linux-aarch64 | grep -q '(NEEDED)'; then
            echo "needy-linux-aarch64 is not statically linked" >&2
            exit 1
          fi
          tar -czf needy-aarch64-apple-darwin.tar.gz -C pack needy needy-linux-aarch64
          tar -tzvf needy-aarch64-apple-darwin.tar.gz
          shasum -a 256 needy-aarch64-apple-darwin.tar.gz | awk '{ print $1 }' > needy-aarch64-apple-darwin.tar.gz.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: needy-aarch64-apple-darwin.tar.gz
          # Replaces the binary job's archive of the same name.
          overwrite: true
          retention-days: 7
          path: |
            needy-aarch64-apple-darwin.tar.gz
            needy-aarch64-apple-darwin.tar.gz.sha256

  # Notarizes the signed macOS binaries, as moeru-ai/auv's `notarize-macos`
  # job does, on publishing runs only. A bare executable cannot be stapled, so
  # Gatekeeper checks the ticket online on first launch.
  notarize-macos:
    name: Notarize macOS ${{ matrix.archive }}
    needs:
      - binary
      - macos-guest
    runs-on: macos-15
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release && inputs.tag_name != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive: needy-aarch64-apple-darwin.tar.gz
          - archive: needy-x86_64-apple-darwin.tar.gz
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.archive }}

      - name: Set up notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials needy-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      # The x86_64 binary cannot run on this arm64 runner without Rosetta, so
      # only the arm64 one is started; both were started where they were built.
      - name: Submit executable for notarization
        run: |
          set -euo pipefail
          tar -xzf ${{ matrix.archive }}
          codesign --verify --strict --verbose=2 needy
          zip needy-notary.zip needy
          xcrun notarytool submit needy-notary.zip --keychain-profile needy-notary --wait
          if [ "$(lipo -archs needy)" = arm64 ]; then
            ./needy --version
          fi
          # The arm64 archive also holds the guest needy (`macos-guest`).
          files=(needy)
          if [ -e needy-linux-aarch64 ]; then files+=(needy-linux-aarch64); fi
          tar -czf ${{ matrix.archive }} "${files[@]}"
          shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Upload notarized macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: notarized-${{ matrix.archive }}
          retention-days: 7
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  # Picks the archives a release gets, checks every `.sha256`, and attests
  # each archive's build provenance with `actions/attest-build-provenance`
  # (Sigstore, public-good instance for a public repository), which `gh
  # attestation verify ARCHIVE -R needy-dev/needy` checks. It runs on every
  # run, after `notarize-macos` when that runs, so `publish` uploads exactly
  # what it checked; it attests only on a publishing run, or on a dispatch
  # that asks with `attest`, since an attestation is a public record.
  # Reference: https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations
  attest:
    name: Check and attest the archives
    needs:
      - binary
      - macos-guest
      - images
      - notarize-macos
    # `notarize-macos` is skipped on a run that does not publish.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Only archives and their checksums are release assets; the notarized
      # macOS archives replace the signed-only ones of the same name, as in
      # moeru-ai/auv's publish job.
      - name: Prefer notarized macOS archives
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print0 | while IFS= read -r -d '' file; do
            case "$file" in
              artifacts/notarized-*/*) cp -f "$file" release/ ;;
              *apple-darwin*) [ -e "release/$(basename "$file")" ] || cp "$file" release/ ;;
              *) cp "$file" release/ ;;
            esac
          done
          if [ "$PUBLISH" = true ]; then
            test "$(find artifacts -path 'artifacts/notarized-*' -type f | wc -l)" -eq 4
          fi

      # NOTICE(crlf-sha256): the Windows job's `.sha256` comes from
      # PowerShell's `Set-Content`, which ends it with CRLF; `sha256sum -c`
      # takes the CR as part of the digest and finds no checksum line. Seen
      # in the first run of this job on a dispatch; before step 4 the check
      # ran only on publishing runs, so no release had hit it yet.
      - name: Verify checksums
        working-directory: release
        run: |
          ls -lh
          for sum in *.sha256; do
            echo "$(tr -d '\r\n' < "$sum")  ${sum%.sha256}" | sha256sum -c -
          done

      - name: Attest build provenance
        if: env.PUBLISH == 'true' || inputs.attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Upload the release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          # See NOTICE(artifact-retention); the archives are compressed.
          retention-days: 7
          compression-level: 0
          path: release

  publish:
    name: Publish release artifacts
    needs:
      - attest
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release && inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Download the checked release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          fail_on_unmatched_files: true
          files: release/*
