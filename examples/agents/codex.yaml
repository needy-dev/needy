# Codex in an actor, from the agents image (Dockerfile here). Every shell it
# starts, and so every command it runs, goes to the `build` executor, which
# holds the workspace.
#
# Build the image once per host (README.md has every driver):
#   docker build -t needy-agents examples/agents       # container drivers: that is all
#   needy image build --from needy-agents               # VM drivers too, again after each rebuild
# Then, once, the directory the login is kept in:
#   mkdir -p ~/needy-state/codex
#   needy run create -it --profile examples/agents/codex.yaml
#
# On the first start choose "Sign in with Device Code" (or run
# `codex login --device-auth`): open the link on any machine and enter the
# code. The default browser sign-in waits for a callback on the actor's
# localhost:1455, which a browser elsewhere cannot reach. Device code sign-in
# must be enabled in the ChatGPT account's security settings. The login is
# mirrored back to ~/needy-state/codex when the run ends.
user: { name: agent, uid: 1000, gid: 1000 }

actor:
  driver: linux-firecracker
  image: needy-agents
  workspace: { path: ~/workspace, from: "executor:build:~/workspace", writable: true }
  # NOTICE: Codex's own sandbox is off: the commands it runs leave the actor
  # for the executor anyway (the executor and the actor are the boundary),
  # and its Linux sandbox would wrap only the actor's side of each exec.
  # Approvals stay as Codex defaults them.
  # The image's binary is pinned, and no metrics go out, so only the hosts
  # below are needed. Reference: https://developers.openai.com/codex/config-reference
  command:
    - codex
    - --sandbox
    - danger-full-access
    - -c
    - check_for_update_on_startup=false
    - -c
    - analytics.enabled=false
  # Without a ChatGPT login: an API key. Codex's sign-in screen then says
  # "Detected OPENAI_API_KEY environment variable" and stores the key in
  # ~/.codex/auth.json, which the mapping below keeps. The key lives in the
  # actor (needy has no header injection yet, `TODO(mitm)`) and in the run's
  # stored profile, so set it in a private profile that `extends:` this
  # one, never in a shared file:
  # env: { OPENAI_API_KEY: sk-... }
  network:
    # Reference: https://developers.openai.com/codex/auth
    # auth.openai.com: sign-in and token refresh; chatgpt.com: a ChatGPT
    # plan's model API; api.openai.com: an API key's.
    allow: [auth.openai.com, chatgpt.com, api.openai.com]

executors:
  build: { driver: linux-container, key: "{run}", max_procs: 8 }

commands:
  # Codex runs each command in `bash -lc ...`.
  - match: "{bash,sh,dash,zsh} **"
    to: build
  # Identity probes stay on the actor's recipe.
  - match: "{uname,lscpu,hostname,nproc,free,uptime} **"
    to: actor

# The login (auth.json), config and sessions survive stateless actors:
# copied in at the start, mirrored back at the end. Credentials then live in
# the actor, where the agent can read them (see README.md).
# NOTICE: the filters are on copy-in, which the control host packs with
# them. An actor's mirror-out sends its whole directory: the guest packs it
# without the mapping's filter (`mirror_out` in
# crates/core-actor/src/guest/init/files.rs), so what a filter leaves out
# still reaches the host, and is only left out of the next copy-in.
files:
  codex-in:
    mode: copy-in
    from: "host:~/needy-state/codex/"
    to: "actor:~/.codex/"
    filter: ["- /tmp/**", "- /.tmp/**", "- /log/**", "+ **"]
  codex-out:
    mode: mirror-out
    from: "actor:~/.codex/"
    to: "host:~/needy-state/codex/"
run_files: [codex-in, codex-out]
