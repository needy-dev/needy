# Claude Code in an actor, from the agents image (Dockerfile here). Every
# shell it starts, and so every command its Bash tool runs, goes to the
# `build` executor, which holds the workspace.
#
# Build the image once per host (README.md has every driver):
#   docker build -t needy-agents examples/agents       # container drivers: that is all
#   needy image build --from needy-agents               # VM drivers too, again after each rebuild
# Then, once, the directory the login is kept in:
#   mkdir -p ~/needy-state/claude
#   needy run create -it --profile examples/agents/claude.yaml
#
# On the first start, log in with /login: Claude Code prints a URL; open it
# on any machine, sign in, and paste the code the page shows at "Paste code
# here if prompted". The login is mirrored back to ~/needy-state/claude when
# the run ends and copied in at the next start.
user: { name: agent, uid: 1000, gid: 1000 }

actor:
  driver: linux-firecracker
  image: needy-agents
  workspace: { path: ~/workspace, from: "executor:build:~/workspace", writable: true }
  command: [claude]
  env:
    # One directory holds the login (.credentials.json), the account and
    # onboarding state (.claude.json, otherwise ~/.claude.json), settings
    # and sessions, so one mapping keeps them all.
    # Reference: https://code.claude.com/docs/en/claude-directory
    CLAUDE_CONFIG_DIR: /home/agent/.claude
    # The image's binary is pinned, and the root file system is read-only:
    # no update checks (downloads.claude.ai).
    DISABLE_UPDATES: "1"
    # No telemetry, error reports or release notes, and no official plugin
    # marketplace cloned from github.com at the first start, so only the
    # hosts below are needed. Reference: https://code.claude.com/docs/en/env-vars
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: "1"
    # Without a subscription login: an API key, or a token from
    # `claude setup-token` run elsewhere. Either then lives in the actor's
    # environment (needy has no header injection yet, `TODO(mitm)`) and in
    # the run's stored profile, so set it in a private profile that
    # `extends:` this one, never in a shared file:
    # ANTHROPIC_API_KEY: sk-ant-...
    # CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-...
  network:
    # Reference: https://code.claude.com/docs/en/network-config#network-access-requirements
    # api.anthropic.com: the API; claude.ai, claude.com and
    # platform.claude.com: claude.ai and Console sign-in and token refresh.
    allow: [api.anthropic.com, claude.ai, claude.com, platform.claude.com]

executors:
  build: { driver: linux-container, key: "{run}", max_procs: 8 }

commands:
  # The Bash tool runs `bash -c -l ...`; scripts and builds start under it.
  - match: "{bash,sh,dash,zsh} **"
    to: build
  # Identity probes stay on the actor's recipe.
  - match: "{uname,lscpu,hostname,nproc,free,uptime} **"
    to: actor

# The login survives stateless actors: copied in at the start, mirrored back
# at the end. Credentials then live in the actor, where the agent can read
# them (see README.md).
# NOTICE: the filters are on copy-in, which the control host packs with
# them. An actor's mirror-out sends its whole directory: the guest packs it
# without the mapping's filter (`mirror_out` in
# crates/core-actor/src/guest/init/files.rs), so what a filter leaves out
# still reaches the host, and is only left out of the next copy-in.
files:
  claude-in:
    mode: copy-in
    from: "host:~/needy-state/claude/"
    to: "actor:~/.claude/"
    filter: ["- /shell-snapshots/**", "- /downloads/**", "+ **"]
  claude-out:
    mode: mirror-out
    from: "actor:~/.claude/"
    to: "host:~/needy-state/claude/"
run_files: [claude-in, claude-out]
