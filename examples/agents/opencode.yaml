# opencode in an actor, from the agents image (opencode is in needy's base
# image too). Every shell it starts, and so every command its bash tool
# runs, goes to the `build` executor, which holds the workspace.
# examples/opencode runs it against a local model instead.
#
# Build the image once per host (README.md has every driver):
#   docker build -t needy-agents examples/agents       # container drivers: that is all
#   needy image build --from needy-agents               # VM drivers too, again after each rebuild
# Then, once, the directory the login is kept in:
#   mkdir -p ~/needy-state/opencode
#   needy run create -it --profile examples/agents/opencode.yaml
#
# On the first start, run /connect (or `opencode auth login`) and pick a
# provider: an API key is pasted in; GitHub Copilot signs in with a device
# code; a browser sign-in that calls back to the actor's localhost cannot
# finish from a browser elsewhere. The login (auth.json) is mirrored back to
# ~/needy-state/opencode/share/opencode when the run ends.
user: { name: agent, uid: 1000, gid: 1000 }

actor:
  driver: linux-firecracker
  image: needy-agents
  workspace: { path: ~/workspace, from: "executor:build:~/workspace", writable: true }
  command: [opencode]
  env:
    # The image's binary is pinned, and the root file system is read-only.
    OPENCODE_DISABLE_AUTOUPDATE: "1"
    # Without /connect: a provider's API key (opencode reads
    # ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, ...). It then
    # lives in the actor (needy has no header injection yet, `TODO(mitm)`)
    # and in the run's stored profile, so set it in a private profile that
    # `extends:` this one, never in a shared file:
    # ANTHROPIC_API_KEY: sk-ant-...
  network:
    # opencode.ai: OpenCode Zen and the config schema; models.dev: the model
    # catalog; registry.npmjs.org: the provider packages opencode installs
    # when it first uses a provider; then the providers' APIs: Anthropic,
    # OpenAI, OpenRouter and GitHub Copilot (github.com and api.github.com
    # for its device sign-in). Add another provider's host here;
    # `needy report` lists denied hosts.
    allow: [opencode.ai, "*.opencode.ai", models.dev, "*.models.dev", registry.npmjs.org,
            api.anthropic.com, api.openai.com, openrouter.ai,
            github.com, api.github.com, api.individual.githubcopilot.com]

executors:
  build: { driver: linux-container, key: "{run}", max_procs: 8 }

commands:
  # The bash tool runs `bash -c ...`.
  - match: "{bash,sh,dash,zsh} **"
    to: build
  # Identity probes stay on the actor's recipe.
  - match: "{uname,lscpu,hostname,nproc,free,uptime} **"
    to: actor

# The data directory (auth.json, sessions) survives stateless actors: copied
# in at the start (without the language servers and logs opencode writes
# there), mirrored back at the end. Credentials then live in the actor, where
# the agent can read them (see README.md).
# NOTICE: the mappings name ~/.local, not ~/.local/share/opencode: copy-in
# gives the user only the directory it names and what it unpacks, so the
# parents it creates on the way (~/.local, ~/.local/share) would stay root's,
# and opencode, which also writes ~/.local/state, could not start (`EACCES:
# permission denied, mkdir '/home/agent/.local/state'`). The host directory
# therefore holds share/opencode/. Remove the indirection once copy-in gives
# the user the parents it creates under the home.
# NOTICE: the filters are on copy-in, which the control host packs with
# them. An actor's mirror-out sends its whole directory: the guest packs it
# without the mapping's filter (`mirror_out` in
# crates/core-actor/src/guest/init/files.rs), so what a filter leaves out
# still reaches the host, and is only left out of the next copy-in.
files:
  opencode-in:
    mode: copy-in
    from: "host:~/needy-state/opencode/"
    to: "actor:~/.local/"
    filter: ["- /share/opencode/bin/**", "- /share/opencode/log/**", "+ /share/opencode/**", "+ /state/opencode/**", "- **"]
  opencode-out:
    mode: mirror-out
    from: "actor:~/.local/"
    to: "host:~/needy-state/opencode/"
run_files: [opencode-in, opencode-out]
