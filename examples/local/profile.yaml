# Runs on any machine without KVM: no actor, this machine as a native executor.
# Shows copy-in, mirror-out, chaos on commands and terminal recordings.
user: { name: agent, uid: 1000, gid: 1000 }
executors:
  here:
    runtime: native
    workspace: /tmp/needy-native-ws
commands:
  - { match: "**", to: here }
files:
  seed:
    mode: copy-in
    from: "host:./seed/"
    to: "executor:here:/tmp/needy-native-ws"
    filter: ["- /secret.txt", "+ **"]
  results:
    mode: mirror-out
    from: "executor:here:/tmp/needy-native-ws"
    to: "host:./out/{session}/"
session_files: [seed, results]
chaos:
  seed: 7
  faults:
    - { on: exec, match: "curl **", errno: ECONNREFUSED }
    - { on: exec, match: "sleep *", delay: 500ms }
