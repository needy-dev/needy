# This machine as a native executor for `needy exec --run`: copy-in,
# mirror-out, chaos on commands and the run's trace. Every run has an actor,
# so the control host needs KVM; the actor only waits. Without KVM,
# `needy exec --runner NAME` runs commands on a runner's machine, without
# rules, chaos or a trace.
user: { name: agent, uid: 1000, gid: 1000 }
actor:
  command: [sleep, infinity]
executors:
  here:
    provider: native
    workspace: /tmp/needy-native-ws
commands:
  - { match: "**", to: here }
files:
  seed:
    mode: copy-in
    from: "host:./seed/"
    to: "executor:here:/tmp/needy-native-ws"
    filter: ["- /secret.txt", "+ **"]
  results:
    mode: mirror-out
    from: "executor:here:/tmp/needy-native-ws"
    to: "host:./out/{run}/"
run_files: [seed, results]
chaos:
  seed: 7
  faults:
    - { on: exec, match: "curl **", errno: ECONNREFUSED }
    - { on: exec, match: "sleep *", delay: 500ms }
