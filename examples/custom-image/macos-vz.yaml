# The custom image on a Mac with Apple silicon, in a macos-vz VM: build it
# for linux/arm64 (Docker on the Mac builds arm64 natively), then its VM
# image, which boots needy's arm64 kernel from the base (`needy image
# pull`):
#
#   docker build -t needy-custom-jq examples/custom-image
#   needy image build --from needy-custom-jq
#
# The executor is the Mac itself, as in examples/macos-vz. Create its
# directory first: `mkdir -p /tmp/needy-custom-image-ws`.
user: { name: agent, uid: 1000, gid: 1000 }
actor:
  driver: macos-vz
  image: needy-custom-jq
  workspace: { path: ~/workspace, from: "executor:mac:/tmp/needy-custom-image-ws", writable: true }
  command:
    - /bin/sh
    - -c
    - |
      echo "== jq in the actor"; command -v jq; echo '{"tool":"jq"}' | jq -r .tool
      echo "== routed python3"
      python3 -c "import platform; print(platform.system())"
      python3 -c "import sys; sys.exit(7)"; echo "routed exit=$?"
executors:
  mac:
    driver: native
commands:
  - { match: "python3 **", to: mac }
