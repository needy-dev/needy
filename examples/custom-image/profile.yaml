# A custom actor image (the Dockerfile here: needy's base plus jq) on a
# Linux host with KVM: a Firecracker actor that boots the VM image made from
# it. Build the image, then its VM image:
#
#   docker build -t needy-custom-jq examples/custom-image
#   needy image build --from needy-custom-jq
#
# jq runs in the actor; python3 is routed to an executor, as in
# examples/smoke. `linux-container.yaml` runs the same image as a container
# on a host without KVM, and `macos-vz.yaml` and
# `macos-apple-container.yaml` on a Mac with Apple silicon.
user: { name: agent, uid: 1000, gid: 1000 }
actor:
  driver: linux-firecracker
  image: needy-custom-jq
  workspace: { path: ~/workspace, from: "executor:build:~/workspace", writable: true }
  command:
    - /bin/sh
    - -c
    - |
      echo "== jq in the actor"; command -v jq; echo '{"tool":"jq"}' | jq -r .tool
      echo "== routed python3"
      python3 -c "import os,platform; print(platform.node(), os.getcwd())"
      python3 -c "import sys; sys.exit(7)"; echo "routed exit=$?"
executors:
  build: { driver: linux-container, key: "{run}", max_procs: 4 }
commands:
  - { match: "python3 **", to: build }
