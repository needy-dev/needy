# The smoke test with an Apple `container` actor, for a Mac with Apple
# silicon: the driving program is `sh` in a container that Apple's
# `container` runs in its own lightweight VM; only python3 is routed, to this
# Mac (a native executor), and the executor's directory is the actor's
# workspace. The driver pulls the base image of this needy's release; a
# needy without a release builds it with `needy image build
# --macos-apple-container` and adds `image: needy-actor:latest` to `actor`.
# Create the executor's directory first: `mkdir -p /tmp/needy-apple-ws`.
user: { name: agent, uid: 1000, gid: 1000 }
actor:
  driver: macos-apple-container
  recipe: ../opencode/gce.recipe.yaml
  workspace: { path: ~/workspace, from: "executor:build:/tmp/needy-apple-ws", writable: true }
  network:
    allow: [example.com]
  command:
    - /bin/sh
    - -c
    - |
      echo "== actor"; uname -a; hostname; id
      grep -c ^processor /proc/cpuinfo; nproc; free -m | head -2
      echo "== routed python3"
      python3 -c "import os,platform; print(platform.system(), os.getcwd())"
      echo hello-from-actor > ~/workspace/from-actor.txt
      python3 -c "print(open('from-actor.txt').read().strip())"
      python3 -c "open('from-executor.txt','w').write('hi-from-executor')"
      cat ~/workspace/from-executor.txt; echo; ls -la ~/workspace
      python3 -c "import sys; sys.exit(7)"; echo "routed exit=$?"
      echo "== gateway"
      curl -sS -o /dev/null -w "example.com %{http_code}\n" https://example.com/
      curl -sS -o /dev/null https://example.org/; echo "example.org exit=$?"
executors:
  build:
    driver: native
commands:
  - { match: "python3 **", to: build }
