# A Docker executor for `needy exec --run`. The actor only waits: the
# commands come from `needy exec`, which the rules send to `build`.
# `needy exec --runner NAME` reaches a runner's machine without a run.
user: { name: agent, uid: 1000, gid: 1000 }
actor:
  command: [sleep, infinity]
executors:
  build:
    provider: docker
    key: "{run}"
    # Run options are typed fields, each a Docker API field (see the
    # profile design note's "Run options").
    docker:
      cpus: 2
      memory: 2GiB
      pids_limit: 1024
      env: { NEEDY_EXAMPLE: cli }
commands:
  - { match: "**", to: build }
