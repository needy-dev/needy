# Smoke test: the driving program is `sh` in the actor; only python3 is routed.
user: { name: agent, uid: 1000, gid: 1000 }
actor:
  recipe: ../opencode/gce.recipe.yaml
  command:
    - /bin/sh
    - -c
    - |
      echo "== actor"; uname -a; hostname; id
      grep -m1 "model name" /proc/cpuinfo; cat /sys/class/dmi/id/product_name; systemd-detect-virt
      echo "== routed python3"
      python3 -c "import os,platform; print(platform.node(), os.getcwd(), os.getuid())"
      echo hello-from-actor > ~/workspace/from-actor.txt
      python3 -c "print(open('from-actor.txt').read().strip())"
      python3 -c "open('from-executor.txt','w').write('hi-from-executor')"
      cat ~/workspace/from-executor.txt; echo; ls -la ~/workspace
      python3 -c "import sys; sys.exit(7)"; echo "routed exit=$?"
executors:
  build: { runtime: docker, key: "{session}", max_procs: 4 }
commands:
  - { match: "python3 **", to: build }
files:
  workspace: { mode: mount, from: "executor:build:~/workspace/", to: "actor:~/workspace/", writable: true }
session_files: [workspace]
