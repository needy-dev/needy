# Latency and throughput probes run inside the actor. Run it with
# `cargo xtask bench run --profile examples/bench/profile.yaml`, which builds
# the probes into target/bench-probe/ for the copy-in below. The probes run
# from the home directory, not /.needy, because execs made by programs in
# /.needy are never routed.
user: { name: agent, uid: 1000, gid: 1000 }
actor:
  recipe: ../opencode/gce.recipe.yaml
  command:
    - /bin/sh
    - -c
    - |
      ~/probe/xtask bench suite \
        "spawn -n 300 --label actor-local -- /usr/bin/test 1" \
        "spawn -n 300 --label actor-proxy-decide-local -- /bin/sh -c true" \
        "spawn -n 300 --label actor-routed-mac -- true" \
        "pipe --label actor-routed-mac-64MiB -- head -c 67108864 /dev/zero" \
        "fs --label actor-tmpfs --mib 256 --files 1000 /tmp/fsbench" \
        "fs --label actor-sshfs-mac-tunnel --mib 64 --files 300 /home/agent/workspace/fsbench" \
        "spawn -n 100 --label actor-gateway-http -- curl -s -o /dev/null http://model.needy/api/version"
  network:
    upstream: { model.needy: "http://127.0.0.1:11434" }
executors:
  mac:
    runtime: remote
    remote: { url: "http://127.0.0.1:17401", token_env: NEEDY_MAC_TOKEN }
    workspace: /Users/user/needy-ws/demo
    path_map: { /home/agent/workspace: /Users/user/needy-ws/demo }
commands:
  - { match: "{true,head} **", to: mac }
files:
  workspace: { mode: mount, from: "executor:mac:/Users/user/needy-ws/demo/", to: "actor:~/workspace/", writable: true }
  probe: { mode: copy-in, from: "host:../../target/bench-probe/", to: "actor:~/probe/" }
run_files: [workspace, probe]
