[package]
name = "needy-api-client"
description = "Rust client for the Needy daemon API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
backon.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
needy-api-proto.workspace = true
needy-common.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "tls-ring", "tls-native-roots"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock.workspace = true

[dev-dependencies]
needy-core-executor.workspace = true
tempfile.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }
