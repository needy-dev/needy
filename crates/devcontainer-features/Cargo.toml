[package]
name = "devcontainer-features"
description = "Standalone Dev Container Features metadata parser (JSONC), dependency/installsAfter topological resolver, OCI Distribution v2 fetcher/cache, and install.sh runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
flate2.workspace = true
jsonc-parser.workspace = true
oci-client.workspace = true
# Registry credentials and TLS, shared with every needy OCI client.
oci-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
oci-registry = { workspace = true, features = ["test-support"] }
