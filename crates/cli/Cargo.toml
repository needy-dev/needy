[package]
name = "needy-cli"
description = "The needy command: CLI, daemon, executor, and the actor's init and proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "needy"
path = "src/main.rs"

[dependencies]
anstyle.workspace = true
anyhow.workspace = true
base64.workspace = true
bollard.workspace = true
clap.workspace = true
comfy-table.workspace = true
etcetera.workspace = true
flate2.workspace = true
futures-util.workspace = true
gethostname.workspace = true
http.workspace = true
humantime.workspace = true
hyper = { workspace = true, features = ["http2"] }
hyper-util = { workspace = true, features = ["http2"] }
ignore.workspace = true
indicatif.workspace = true
libc.workspace = true
needy-api-client.workspace = true
needy-api-server.workspace = true
needy-common.workspace = true
needy-config.workspace = true
serde_yaml.workspace = true
needy-core.workspace = true
needy-core-actor.workspace = true
# `--insecure-registry` hosts are checked as registry access reads them.
oci-registry.workspace = true
needy-core-executor.workspace = true
needy-daemon.workspace = true
needy-trace = { workspace = true, features = ["sqlite"] }
reqwest.workspace = true
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
shell-words.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic = { workspace = true, features = ["transport"] }
tower.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
http.workspace = true
indicatif = { workspace = true, features = ["in_memory"] }
tower.workspace = true
needy-common = { workspace = true, features = ["testing"] }
portable-pty.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }
