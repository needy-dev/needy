[package]
name = "needy-core-executor"
description = "Needy executors: processes, executor providers and the terminal relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
bollard.workspace = true
bytes.workspace = true
crossterm.workspace = true
futures-util.workspace = true
needy-api-client.workspace = true
needy-api-proto.workspace = true
needy-common.workspace = true
needy-config.workspace = true
parse-size.workspace = true
portable-pty.workspace = true
vt100.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
# `v5`: short, stable names for Docker executors' socket directories.
uuid = { workspace = true, features = ["v5"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll", "socket", "term", "user"] }

[dev-dependencies]
tempfile.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }
