# pi in an actor, built from needy's `builtin:pi` feature (`features/pi/`).
#
# Start pi directly (needy builds and caches the feature layer on first run):
#   needy run create -it --profile builtin:pi
#
# Extend this profile to add an executor, routing rules, or a stricter network
# allowlist. The `builtin:pi` feature automatically syncs `~/.pi/agent` with
# needy's `<data_dir>/files/pi` store across runs and sets
# `PI_SKIP_VERSION_CHECK=1` and `PI_TELEMETRY=0`.
user: { name: agent, uid: 1000, gid: 1000 }

actor:
  driver: linux-firecracker
  image:
    layers:
      - feature: builtin:pi
  command: [pi]
  network:
    allow: ["*"]
