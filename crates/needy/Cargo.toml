[package]
name = "needy"
description = "Route a driving program's exec, files and network to executors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
needy-api-client = { path = "../api-client", version = "0.1.0" }
needy-api-proto = { path = "../api-proto", version = "0.1.0" }
needy-api-server = { path = "../api-server", version = "0.1.0" }
needy-config = { path = "../config", version = "0.1.0" }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4"
portable-pty = "0.9"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true, features = ["router", "transport"] }
uuid = { version = "1", features = ["v4"] }
http = "1"
tower = "0.5"

[dev-dependencies]
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"
