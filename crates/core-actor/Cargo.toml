[package]
name = "needy-core-actor"
description = "Needy actors: the in-guest init and proxy, and the host side: VM start-up, host detection and the actor gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# Fixtures for other crates' tests, enabled from their dev-dependencies:
# `image::store::import::testing`, synthetic OCI images `FROM` a stand-in
# `actor-base` written into `oci-registry`'s test registry, and
# `sidecar::gateway::testing`, a SOCKS5 proxy for the gateway's upstream.
test-support = ["oci-registry/test-support"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
backhand.workspace = true
bytes.workspace = true
devcontainer-features.workspace = true
flate2.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
needy-common.workspace = true
needy-config.workspace = true
needy-core.workspace = true
# The Docker-compatible engine client the `linux-container` driver shares with
# the executor's (`engine`); the dependency points this way only.
needy-core-executor.workspace = true
needy-trace = { workspace = true, features = ["timing"] }
object.workspace = true
oci-layer = { workspace = true, features = ["squashfs"] }
# The layer registry (`image::store::registry`) speaks OCI Distribution and
# writes standard image configs; registry access (credentials, TLS) is
# `oci-registry`'s, for features too.
oci-client.workspace = true
oci-registry.workspace = true
oci-spec.workspace = true
# Imported image layers may be zstd-compressed (`image::store::import`).
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
# A layer's canonical form in the layer store (`image::store`) is a tar archive.
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-socks.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true

# Stopping the VM sends Firecracker `SIGTERM`; reconciling a leftover VM
# finds its process by its command line.
[target.'cfg(unix)'.dependencies]
# A workspace mount's SFTP stream (`sshfs::stream`) is plain Unix.
needy-api-client.workspace = true
needy-api-proto.workspace = true
nix = { workspace = true, features = ["signal"] }
sysinfo.workspace = true

# The guest runs only inside a Linux actor, KVM is Linux's, and a container
# actor's host-side workspace mounts (sshfs, FUSE) are Linux's too.
[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings.workspace = true
kvm-ioctls.workspace = true
backon.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["fs", "hostname", "ioctl", "mount", "net", "process", "reboot", "sched", "signal", "socket"] }
procfs-core.workspace = true
# `tonic014`: the process service for a driving program on a terminal is
# served on a vsock listener.
tokio-vsock = { workspace = true, features = ["tonic014"] }
tonic = { workspace = true, features = ["router", "transport"] }
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
oci-registry = { workspace = true, features = ["test-support"] }
needy-common = { workspace = true, features = ["testing"] }
needy-core-executor = { workspace = true, features = ["test-support"] }
needy-trace = { workspace = true, features = ["memory", "timing"] }
serde_yaml.workspace = true
tonic.workspace = true
