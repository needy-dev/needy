[package]
name = "needy-core-actor"
description = "Needy actors: the in-guest init and proxy, and the host side: VM start-up, host detection and the actor gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bollard.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
needy-config.workspace = true
needy-core.workspace = true
needy-trace = { workspace = true, features = ["timing"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# Stopping the VM sends Firecracker `SIGTERM`.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

# The guest runs only inside a Linux actor, KVM is Linux's, and a container
# actor's host-side workspace mounts (sshfs, FUSE) are Linux's too.
[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings.workspace = true
kvm-ioctls.workspace = true
backon.workspace = true
libc.workspace = true
needy-api-client.workspace = true
needy-api-proto.workspace = true
needy-common.workspace = true
needy-core-executor.workspace = true
nix = { workspace = true, features = ["fs", "hostname", "ioctl", "mount", "net", "process", "reboot", "sched", "signal", "socket"] }
procfs-core.workspace = true
# `tonic014`: the process service for a driving program on a terminal is
# served on a vsock listener.
tokio-vsock = { workspace = true, features = ["tonic014"] }
tonic = { workspace = true, features = ["router", "transport"] }
tracing-subscriber.workspace = true

[dev-dependencies]
needy-trace = { workspace = true, features = ["memory", "timing"] }
serde_yaml.workspace = true
tempfile.workspace = true
