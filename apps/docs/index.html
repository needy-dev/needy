<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>needy · how a run routes work</title>
    <meta name="description" content="Run the driving program in a small sandbox, the actor, and send its commands, files and network requests by rule to executors. Watch each step, and route your own commands." />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before the first paint, as src/theme.ts decides it, so the page does not flash.
      (function () {
        var forced = new URLSearchParams(location.search).get('theme')
        var saved
        try { saved = localStorage.getItem('needy:theme') } catch (e) {}
        var theme = forced === 'light' || forced === 'dark' ? forced : saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
