[workspace]
members = [
    "crates/api-client",
    "crates/api-proto",
    "crates/api-server",
    "crates/cli",
    "crates/common",
    "crates/config",
    "crates/core",
    "crates/core-actor",
    "crates/core-executor",
    "crates/daemon",
    "crates/devcontainer-features",
    "crates/oci-layer",
    "crates/oci-registry",
    "crates/trace",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.23"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/needy-dev/needy"

[workspace.dependencies]
anstyle = "1"
anyhow = "1"
async-trait = "0.1"
backon = { version = "1", default-features = false, features = ["tokio-sleep"] }
base64 = "0.22"
# SquashFS writing only, zlib only: the guest disk the VM drivers attach,
# which both actor kernels read (`CONFIG_SQUASHFS_ZLIB`).
backhand = { version = "0.25", default-features = false, features = ["gzip"] }
comfy-table = "7"
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
docker_credential = "1.4"
etcetera = "0.11"
bollard = { version = "0.21", features = ["buildkit", "time"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
fuse3 = { version = "0.10", default-features = false, features = ["tokio-runtime", "unprivileged", "file-lock"] }
flate2 = "1"
gethostname = "1"
glob-match = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
# `WWW-Authenticate` challenge parsing only (`oci-registry`), the version
# `oci-client` 0.15 resolves.
http-auth = { version = "0.1", default-features = false }
humantime = "2"
# The versions Firecracker v1.17.0 uses (`src/vmm/Cargo.toml`), so needy reads
# KVM's supported CPUID as Firecracker does.
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
ignore = "0.4"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
jsonc-parser = { version = "0.34", features = ["serde"] }
libc = "0.2"
nix = { version = "0.30", features = ["signal"] }
# ELF headers only: the daemon checks that a guest needy is a static Linux
# executable for the actors' architecture.
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "std"] }
# OCI Distribution v2 client (`oci-registry`, `devcontainer-features`, the
# layer registry), pinned to 0.15 so it stays on `reqwest` 0.12 +
# `rustls`/`ring` without `aws-lc-sys`. `rustls-tls-native-roots` trusts the
# system's store (`rustls-native-certs`, which honours `SSL_CERT_FILE` and
# `SSL_CERT_DIR`) as well as the bundled WebPKI roots `rustls-tls` brings;
# both select `ring` (`reqwest` 0.12.28 `Cargo.toml`, `__rustls-ring`).
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
# OCI Image Specification types (`oci-layer`); matches the 0.8 already resolved via `oci-client`.
oci-spec = { version = "0.8", default-features = false, features = ["image"] }
portable-pty = "0.9"
vt100 = "0.18"
vte = "0.15"
# Parsing only: the guest reads `/proc` itself and needs no `chrono`.
procfs-core = { version = "0.18", default-features = false }
prost = "0.14"
prost-types = "0.14"
rand = "0.9"
# Test certificates only (`oci-registry`'s test registry), on `ring`.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# `needy image pull`: release downloads (GitHub redirects them, and users
# may sit behind an HTTPS proxy), on the rustls and ring the workspace
# already builds with.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
# The test registry's TLS listener (`oci-registry`), on `ring` like the rest.
# Decodes zstd-compressed OCI layers (`application/vnd.oci.image.layer.v1.tar+zstd`,
# kaniko's and envbuilder's default) in pure Rust, so the static musl and
# Windows builds need no C zstd; its encoder makes test images.
ruzstd = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1"
shellexpand = "3"
subtle = "2"
# Processes only: a restarted control plane finds the Firecracker of a run
# it lost by its command line.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The actor gateway's upstream SOCKS5 proxy (`gateway::upstream`): RFC 1928
# CONNECT with a domain-name target and RFC 1929 username/password, the
# client `reqwest`'s `socks` feature uses. Tokio only (its default).
tokio-socks = "0.5"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-vsock = "0.7"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

devcontainer-features = { path = "crates/devcontainer-features", version = "0.0.23" }
oci-layer = { path = "crates/oci-layer", version = "0.0.23" }
oci-registry = { path = "crates/oci-registry", version = "0.0.23" }
needy-api-client = { path = "crates/api-client", version = "0.0.23" }
needy-api-proto = { path = "crates/api-proto", version = "0.0.23" }
needy-api-server = { path = "crates/api-server", version = "0.0.23" }
needy-common = { path = "crates/common", version = "0.0.23" }
needy-config = { path = "crates/config", version = "0.0.23" }
needy-core = { path = "crates/core", version = "0.0.23" }
needy-core-actor = { path = "crates/core-actor", version = "0.0.23" }
needy-core-executor = { path = "crates/core-executor", version = "0.0.23" }
needy-daemon = { path = "crates/daemon", version = "0.0.23" }
needy-trace = { path = "crates/trace", version = "0.0.23", default-features = false }

# Line tables keep file:line in panics and backtraces, which is what tests,
# logs and agents read. Full debug info adds local variables and types for an
# interactive debugger, and it is most of `target/`. The `test` profile
# inherits this setting. To debug with variables, override it for one build:
# `CARGO_PROFILE_DEV_DEBUG=full cargo build`.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true
