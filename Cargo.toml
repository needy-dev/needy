[workspace]
members = ["crates/exec-intercept", "crates/needy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/needy-dev/needy"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
strip = true
