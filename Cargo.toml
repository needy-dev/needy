[workspace]
members = [
    "crates/api-client",
    "crates/api-proto",
    "crates/api-server",
    "crates/cli",
    "crates/common",
    "crates/config",
    "crates/core",
    "crates/core-actor",
    "crates/core-executor",
    "crates/daemon",
    "crates/trace",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/needy-dev/needy"

[workspace.dependencies]
anstyle = "1"
anyhow = "1"
async-trait = "0.1"
backon = { version = "1", default-features = false, features = ["tokio-sleep"] }
base64 = "0.22"
comfy-table = "7"
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
etcetera = "0.11"
bollard = { version = "0.21", features = ["buildkit", "time"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
gethostname = "1"
glob-match = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
humantime = "2"
# The versions Firecracker v1.17.0 uses (`src/vmm/Cargo.toml`), so needy reads
# KVM's supported CPUID as Firecracker does.
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
ignore = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["signal"] }
portable-pty = "0.9"
vt100 = "0.18"
# Parsing only: the guest reads `/proc` itself and needs no `chrono`.
procfs-core = { version = "0.18", default-features = false }
prost = "0.14"
prost-types = "0.14"
rand = "0.9"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1"
shellexpand = "3"
subtle = "2"
# Processes only: a restarted control plane finds the Firecracker of a run
# it lost by its command line.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-vsock = "0.7"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

needy-api-client = { path = "crates/api-client", version = "0.1.0" }
needy-api-proto = { path = "crates/api-proto", version = "0.1.0" }
needy-api-server = { path = "crates/api-server", version = "0.1.0" }
needy-common = { path = "crates/common", version = "0.1.0" }
needy-config = { path = "crates/config", version = "0.1.0" }
needy-core = { path = "crates/core", version = "0.1.0" }
needy-core-actor = { path = "crates/core-actor", version = "0.1.0" }
needy-core-executor = { path = "crates/core-executor", version = "0.1.0" }
needy-daemon = { path = "crates/daemon", version = "0.1.0" }
needy-trace = { path = "crates/trace", version = "0.1.0", default-features = false }

[profile.release]
lto = "thin"
strip = true
