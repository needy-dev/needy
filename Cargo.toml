[workspace]
members = [
    "crates/api-client",
    "crates/api-proto",
    "crates/api-server",
    "crates/cli",
    "crates/common",
    "crates/core",
    "crates/core-actor",
    "crates/core-executor",
    "crates/daemon",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/needy-dev/needy"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
glob-match = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
humantime = "2"
libc = "0.2"
nix = { version = "0.30", features = ["signal"] }
portable-pty = "0.9"
prost = "0.14"
prost-types = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
serde_yaml = "0.9"
shellexpand = "3"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-vsock = "0.7"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

needy-api-client = { path = "crates/api-client", version = "0.1.0" }
needy-api-proto = { path = "crates/api-proto", version = "0.1.0" }
needy-api-server = { path = "crates/api-server", version = "0.1.0" }
needy-common = { path = "crates/common", version = "0.1.0" }
needy-core = { path = "crates/core", version = "0.1.0" }
needy-core-actor = { path = "crates/core-actor", version = "0.1.0" }
needy-core-executor = { path = "crates/core-executor", version = "0.1.0" }
needy-daemon = { path = "crates/daemon", version = "0.1.0" }

[profile.release]
lto = "thin"
strip = true
