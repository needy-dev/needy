// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.api.daemon.v1;

// HostService describes what this daemon can run.
service HostService {
  rpc GetHost(GetHostRequest) returns (GetHostResponse);
}

message GetHostRequest {}

message GetHostResponse {
  Host host = 1;
}

message Host {
  string instance_id = 1;
  // Runtime image for Docker sessions. Empty when Docker is disabled.
  string image = 2;
  uint32 max_concurrent_runs = 3;
  uint32 active_runs = 4;
  bool host_exec_enabled = 5;
}
