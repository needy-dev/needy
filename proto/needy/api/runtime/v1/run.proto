// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.api.runtime.v1;

import "google/protobuf/timestamp.proto";

// RunService starts batch commands in a session and replays their events.
service RunService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  // Replay events after `after_sequence`, then follow when requested.
  rpc WatchRunEvents(WatchRunEventsRequest) returns (stream WatchRunEventsResponse);
}

message Run {
  string id = 1;
  string session_id = 2;
  repeated string argv = 3;
  RunPhase phase = 4;
  // Set when the phase is RUN_PHASE_EXITED.
  int32 exit_code = 5;
  string error = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp completed_at = 8;
}

enum RunPhase {
  RUN_PHASE_UNSPECIFIED = 0;
  RUN_PHASE_PENDING = 1;
  RUN_PHASE_RUNNING = 2;
  RUN_PHASE_EXITED = 3;
  RUN_PHASE_FAILED = 4;
  RUN_PHASE_STOPPED = 5;
}

message CreateRunRequest {
  string session_id = 1;
  repeated string argv = 2;
  bytes stdin = 3;
}

message CreateRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message StopRunRequest {
  string run_id = 1;
}

message StopRunResponse {}

message WatchRunEventsRequest {
  string run_id = 1;
  uint64 after_sequence = 2;
  bool follow = 3;
}

message WatchRunEventsResponse {
  RunEvent event = 1;
}

message RunEvent {
  uint64 sequence = 1;
  google.protobuf.Timestamp time = 2;
  oneof payload {
    bytes stdout = 3;
    bytes stderr = 4;
    Run state = 5;
  }
}
