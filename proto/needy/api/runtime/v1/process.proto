// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.api.runtime.v1;

// ProcessService runs one native host process over a bidirectional stream.
// It replaces the upgraded HTTP tunnel used by `needy exec` and the proxy.
service ProcessService {
  // The first request must carry `start`.
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
}

message ExecRequest {
  oneof payload {
    ExecStart start = 1;
    bytes stdin = 2;
    bool stdin_eof = 3;
    int32 signal = 4;
    WindowSize resize = 5;
  }
}

message ExecResponse {
  oneof payload {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
    string failure = 4;
  }
}

message ExecStart {
  repeated string argv = 1;
  string cwd = 2;
  map<string, string> env = 3;
  // Allocate a PTY with this initial size. Unset means pipes.
  WindowSize pty = 4;
}

message WindowSize {
  uint32 rows = 1;
  uint32 cols = 2;
}
