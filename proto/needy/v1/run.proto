// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.v1;

import "needy/v1/process.proto";

// RunService manages runs: one actor and the executors bound to it.
service RunService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  // Stream the actor's console output: the guest's boot messages and the
  // driving program's terminal. NOT_FOUND when the run has no actor.
  rpc GetRunLogs(GetRunLogsRequest) returns (stream GetRunLogsResponse);
  // Decide where a command runs and how it is rewritten.
  rpc Decide(DecideRequest) returns (DecideResponse);
}

message CreateRunRequest {
  // Profile as YAML text, self-contained: its `extends` chain merged and its
  // host paths absolute. The daemon reads no path on the client's machine.
  string profile_yaml = 1;
  string group = 3;
  string name = 4;
  // Start the actor; false creates executors only, for `needy exec`.
  bool start_actor = 5;
  // Override the driving program of the actor.
  repeated string actor_command = 6;
  // The profile's name in listings, traces and reports, for example its file
  // name without `.profile.yaml`. Required.
  string profile_name = 7;
  // The actor's recipe as YAML with its `extends` chain merged, when
  // `actor.recipe` names a file. Empty for a built-in recipe or none.
  string recipe_yaml = 8;

  // The client's profile directory, which the daemon cannot read when it
  // runs on another machine.
  reserved 2;
  reserved "profile_dir";
}

message ExecutorRef {
  string name = 1;
  string runtime = 2;
  string instance = 3;
  // The run gave the executor back: it stopped, finished or failed.
  bool released = 4;
}

message Run {
  string run_id = 1;
  string name = 2;
  string group = 3;
  RunState state = 8;
  repeated ExecutorRef executors = 5;
  int64 created_at_ms = 6;
  // The profile's name, as `CreateRunRequest.profile_name` gave it.
  string profile = 7;
  // How the actor's driving program ended. Unset while it runs, for a
  // run without an actor, and for an actor whose VM ended before the
  // program reported its exit.
  ExecExited actor_exit = 9;
  // Why the run failed, with its causes. Empty unless it failed.
  string failure = 10;

  reserved 4;
}

// A run's life cycle. The first terminal state (stopped, finished or
// failed) wins.
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_CREATING = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_STOPPING = 3;
  RUN_STATE_STOPPED = 4;
  // The actor's driving program exited.
  RUN_STATE_FINISHED = 5;
  RUN_STATE_FAILED = 6;
}

message CreateRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {}

message ListRunsResponse {
  repeated Run runs = 1;
}

message StopRunRequest {
  string run_id = 1;
}

message StopRunResponse {}

message GetRunLogsRequest {
  string run_id = 1;
}

message GetRunLogsResponse {
  bytes data = 1;
}

message DecideRequest {
  string run_id = 1;
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
  bool tty = 5;
  // The processes the command runs under, nearest first: its parent, the
  // parent's parent and so on, up to but not including the actor's init.
  // Rules match `when.under` against them.
  repeated Ancestor ancestors = 6;
}

// A process a command runs under.
message Ancestor {
  repeated string argv = 1;
}

message DecideResponse {
  // "actor", an executor name, or empty when denied.
  string target = 1;
  repeated string argv = 2;
  map<string, string> env = 3;
  bool clear_env = 4;
  string cwd = 5;
  // Set when the command must not run: the message to show, either
  // "denied: <rule message>" or "fault injected: <errno>".
  string deny = 6;
  // The value of `ExecStart.search_path_if_missing` for the routed exec.
  bool search_path_if_missing = 7;
}
