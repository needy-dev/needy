// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.v1;

import "needy/v1/process.proto";

// RunService manages runs: one actor and the executors bound to it.
service RunService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  // Stream the actor's console output: the guest's boot messages and the
  // driving program's terminal. NOT_FOUND when the run has no actor.
  rpc GetRunLogs(GetRunLogsRequest) returns (stream GetRunLogsResponse);
  // Stream a run's trace events in order, as the control plane's trace
  // database holds them, for `needy report` on any client.
  rpc GetRunEvents(GetRunEventsRequest) returns (stream GetRunEventsResponse);
  // Decide where a command runs and how it is rewritten.
  rpc Decide(DecideRequest) returns (DecideResponse);
  // Check a profile against the runners it would run on: its runner
  // selectors resolve, and its recipe fits the CPU of the host its actor
  // would run on. Creates nothing.
  rpc CheckProfile(CheckProfileRequest) returns (CheckProfileResponse);
}

message CreateRunRequest {
  // Profile as YAML text, self-contained: its `extends` chain merged and its
  // host paths absolute. The daemon reads no path on the client's machine.
  string profile_yaml = 1;
  string group = 3;
  string name = 4;
  // Override the driving program of the actor.
  repeated string actor_command = 6;
  // The profile's name in listings, traces and reports, for example its file
  // name without `.profile.yaml`. Required.
  string profile_name = 7;
  // The actor's recipe as YAML with its `extends` chain merged, when
  // `actor.recipe` names a file. Empty for a built-in recipe or none.
  string recipe_yaml = 8;
  // Run the driving program on a terminal of this size, which `needy run
  // attach` connects to. Unset: no terminal, stdin `/dev/null`, output to
  // the actor's console.
  WindowSize tty = 9;
  // With tty: start the program after its first terminal client subscribed,
  // so `run create -it` also receives a program that exits immediately.
  bool wait_for_attach = 10;

  // The client's profile directory, which the daemon cannot read when it
  // runs on another machine.
  reserved 2;
  reserved "profile_dir";
  // Whether to start the actor. Every run has an actor; `needy exec
  // --runner` runs commands without one.
  reserved 5;
  reserved "start_actor";
}

message ExecutorRef {
  string name = 1;
  string runtime = 2;
  string instance = 3;
  // The run gave the executor back: it stopped, finished or failed.
  bool released = 4;
  // The control plane restarted, and no runner reported the instance
  // within the time it waits for reports: whether it still runs is unknown.
  bool lost = 5;
}

message Run {
  string run_id = 1;
  string name = 2;
  string group = 3;
  RunState state = 8;
  repeated ExecutorRef executors = 5;
  int64 created_at_ms = 6;
  // The profile's name, as `CreateRunRequest.profile_name` gave it.
  string profile = 7;
  // How the actor's driving program ended. Unset while it runs, for a
  // run without an actor, and for an actor whose VM ended before the
  // program reported its exit.
  ExecExited actor_exit = 9;
  // Why the run failed, with its causes. Empty unless it failed.
  string failure = 10;
  // The driving program runs on a terminal (`CreateRunRequest.tty`).
  bool tty = 11;

  reserved 4;
}

// A run's life cycle. The first terminal state (stopped, finished or
// failed) wins.
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_CREATING = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_STOPPING = 3;
  RUN_STATE_STOPPED = 4;
  // The actor's driving program exited.
  RUN_STATE_FINISHED = 5;
  RUN_STATE_FAILED = 6;
}

message CreateRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {}

message ListRunsResponse {
  repeated Run runs = 1;
}

message StopRunRequest {
  string run_id = 1;
}

message StopRunResponse {}

message GetRunLogsRequest {
  string run_id = 1;
  // Keep streaming what the actor writes until the run ends or the caller
  // leaves.
  bool follow = 2;
}

message GetRunLogsResponse {
  bytes data = 1;
}

message GetRunEventsRequest {
  // A run ID, an ID prefix (the run that started last among those it
  // matches), or `latest`.
  string run_id = 1;
}

message GetRunEventsResponse {
  // The full run ID.
  string run_id = 1;
  repeated StoredEvent events = 2;
}

// One trace event as stored. The payload's schema belongs to its kind and
// version; clients decode it with the same rules as the control plane.
message StoredEvent {
  // The event's place in its run, from 0.
  uint64 seq = 1;
  int64 time_ms = 2;
  // For example `exec.decide`.
  string kind = 3;
  // The payload schema version.
  uint32 version = 4;
  // A JSON object.
  string payload = 5;
}

message DecideRequest {
  string run_id = 1;
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
  bool tty = 5;
  // The processes the command runs under, nearest first: its parent, the
  // parent's parent and so on, up to but not including the actor's init.
  // Rules match `when.under` against them.
  repeated Ancestor ancestors = 6;
}

// A process a command runs under.
message Ancestor {
  repeated string argv = 1;
}

message DecideResponse {
  // "actor", an executor name, or empty when denied.
  string target = 1;
  repeated string argv = 2;
  map<string, string> env = 3;
  bool clear_env = 4;
  string cwd = 5;
  // Set when the command must not run: the message to show, either
  // "denied: <rule message>" or "fault injected: <errno>".
  string deny = 6;
  // The value of `ExecStart.search_path_if_missing` for the routed exec.
  bool search_path_if_missing = 7;
}

message CheckProfileRequest {
  // As in `CreateRunRequest`.
  string profile_yaml = 1;
  string recipe_yaml = 2;
}

message CheckProfileResponse {
  // Where the actor would run; unset when its runner selector does not
  // resolve, which a finding explains.
  Placement actor = 1;
  // Where each executor would run, by name; an executor whose selector does
  // not resolve is missing, and a finding explains why.
  map<string, Placement> executors = 2;
  // The model name of the CPU the recipe was checked against; empty when the
  // actor's host did not report one.
  string actor_cpu = 3;
  repeated ProfileFinding findings = 4;
}

// The host an actor or executor would run on.
message Placement {
  // A runner's name; empty for the control host itself.
  string runner = 1;
}

message ProfileFinding {
  FindingSeverity severity = 1;
  string message = 2;
}

enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  FINDING_SEVERITY_ERROR = 1;
  FINDING_SEVERITY_WARNING = 2;
}
