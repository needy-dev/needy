// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.v1;

// SessionService manages sessions: one actor and the executors bound to it.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  // Stream the actor's console output: the guest's boot messages and the
  // driving program's terminal. NOT_FOUND when the session has no actor.
  rpc GetSessionLogs(GetSessionLogsRequest) returns (stream GetSessionLogsResponse);
  // Decide where a command runs and how it is rewritten.
  rpc Decide(DecideRequest) returns (DecideResponse);
}

message CreateSessionRequest {
  // Profile as YAML text; relative paths resolve against `profile_dir`.
  string profile_yaml = 1;
  string profile_dir = 2;
  string group = 3;
  string name = 4;
  // Start the actor; false creates executors only, for `needy exec`.
  bool start_actor = 5;
  // Override the driving program of the actor.
  repeated string actor_command = 6;
}

message ExecutorRef {
  string name = 1;
  string runtime = 2;
  string instance = 3;
}

message Session {
  string session_id = 1;
  string name = 2;
  string group = 3;
  // "running", "finished" (the actor exited), "stopped" or "failed".
  string state = 4;
  repeated ExecutorRef executors = 5;
  int64 created_at_ms = 6;
  string profile = 7;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {}

message GetSessionLogsRequest {
  string session_id = 1;
}

message GetSessionLogsResponse {
  bytes data = 1;
}

message DecideRequest {
  string session_id = 1;
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
  bool tty = 5;
}

message DecideResponse {
  // "actor", an executor name, or empty when denied.
  string target = 1;
  repeated string argv = 2;
  map<string, string> env = 3;
  bool clear_env = 4;
  string cwd = 5;
  // Set when the command must not run: the message to show, either
  // "denied: <rule message>" or "fault injected: <errno>".
  string deny = 6;
}
