// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.v1;

// ClientService pairs clients (the CLI on another machine, tools) with the
// control plane and manages their tokens.
//
// An operator creates a pairing code with the control daemon's token, or
// with a client token, which has the same rights. `Pair` needs no bearer
// token: the pairing code in the request authenticates it, and the response
// carries the client's own token, which it then presents as its bearer
// token. Every trace event a client causes names it as `client:NAME`.
service ClientService {
  // Create a pairing code. Its secret is in the response only.
  rpc CreatePairingCode(CreatePairingCodeRequest) returns (CreatePairingCodeResponse);
  // Exchange a pairing code for a client token, once.
  rpc Pair(PairRequest) returns (PairResponse);
  // Every client, including revoked ones.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  // Revoke a client's token. It stays listed as revoked.
  rpc RevokeClient(RevokeClientRequest) returns (RevokeClientResponse);
}

message CreatePairingCodeRequest {
  // Required, positive.
  int64 ttl_ms = 1;
  // The name of the client that pairs with it: a DNS label. Empty for
  // `client-<code ID>`.
  string name = 2;
}

message CreatePairingCodeResponse {
  // Public; names the code in logs.
  string id = 1;
  // The client's name once it pairs.
  string name = 2;
  int64 expires_at_ms = 3;
  // The secret to hand to the client; not stored, not shown again.
  string code = 4;
}

message PairRequest {
  string code = 1;
}

message PairResponse {
  Client client = 1;
  // The client's token, a bearer token for every operator method. Not
  // stored, not shown again.
  string token = 2;
}

message Client {
  // Public; names the client in `RevokeClient`.
  string id = 1;
  string name = 2;
  int64 created_at_ms = 3;
  // The last request with its token, to about a minute; 0 before any.
  int64 last_used_at_ms = 4;
  // 0 unless revoked.
  int64 revoked_at_ms = 5;
}

message ListClientsRequest {}

message ListClientsResponse {
  repeated Client clients = 1;
}

message RevokeClientRequest {
  string id = 1;
}

message RevokeClientResponse {}
