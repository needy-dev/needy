// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package needy.v1;

import "needy/v1/process.proto";

// GuestService is served to the supervisor inside an actor microVM over vsock.
service GuestService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // Events observed inside the actor, such as identity probes.
  rpc PushEvents(stream PushEventsRequest) returns (PushEventsResponse);
  rpc ReportExit(ReportExitRequest) returns (ReportExitResponse);
  // A tar archive of a copy-in mapping's host files.
  rpc FetchFiles(FetchFilesRequest) returns (stream FetchFilesResponse);
  // A tar archive for a mirror-out mapping; the first message names it.
  rpc PushFiles(stream PushFilesRequest) returns (PushFilesResponse);
  // What the daemon tells a running actor's init as it happens, on the one
  // stream init holds for the actor's life; it ends with the run. Every
  // daemon-to-init message is a case of `GuestServiceControlResponse`
  // rather than another long-lived call.
  rpc Control(GuestServiceControlRequest) returns (stream GuestServiceControlResponse);
}

message GuestServiceControlRequest {}

message GuestServiceControlResponse {
  oneof message {
    // The executable names the actor hands to the proxy from now on, as
    // `GetConfigResponse.route_names`; `*` routes every exec. Sent first
    // with the list as it is, then each time `needy chaos add` or `rm`
    // changes it.
    RouteList routes = 1;
    // `run stop` asks the actor to end gracefully: init sends SIGTERM to
    // the driving program's process group, SIGKILL after `grace_ms`, and
    // once the program exited mirrors out and reports its exit as usual.
    GracefulStop stop = 2;
  }
}

message RouteList {
  repeated string names = 1;
}

message GracefulStop {
  // How long the driving program has after SIGTERM before SIGKILL.
  int64 grace_ms = 1;
}

message GuestCopy {
  // Mapping name in the profile.
  string name = 1;
  // Path inside the actor.
  string path = 2;
}

// A sensor fault the guest applies itself.
message GuestFault {
  // Milliseconds after the driving program starts.
  int64 at_ms = 1;
  // Sensor reading to force, in millidegrees Celsius.
  int32 temp_mc = 2;
  // The fault's name in the profile, for its `fault.injected` event.
  string name = 3;
}

message FetchFilesRequest {
  string name = 1;
}

message FetchFilesResponse {
  bytes data = 1;
}

message PushFilesRequest {
  string name = 1;
  bytes data = 2;
}

message PushFilesResponse {}

message GuestUser {
  string name = 1;
  uint32 uid = 2;
  uint32 gid = 3;
}

message GuestMount {
  // Path inside the actor.
  string target = 1;
  string executor = 2;
  // Path on the executor.
  string source = 3;
  bool writable = 4;
  // Command that serves SFTP on stdin and stdout on the executor.
  repeated string sftp_command = 5;
}

message GuestSensor {
  string chip = 1;
  int32 idle_mc = 2;
}

message GetConfigRequest {}

message GetConfigResponse {
  string run_id = 1;
  GuestUser user = 2;
  // Executable names or paths the kernel hands to the proxy.
  repeated string route_names = 3;
  string hostname = 4;
  int64 uptime_offset_secs = 5;
  repeated GuestMount mounts = 6;
  repeated string command = 7;
  map<string, string> env = 8;
  string cwd = 9;
  // Port on the host (CID 2) that serves the actor gateway.
  uint32 gateway_port = 10;
  repeated GuestSensor sensors = 11;
  repeated GuestCopy copy_in = 12;
  repeated GuestCopy mirror_out = 13;
  repeated GuestFault sensor_faults = 14;
  // Run the driving program on a terminal of this size and serve
  // `ProcessService` for it on vsock port `process_port`; unset for none.
  WindowSize tty = 15;
  uint32 process_port = 16;
  // Subscribe the first terminal client before starting the program.
  bool wait_for_attach = 17;
  // The user and group the daemon runs as. Where init binds its process
  // service on a Unix socket the daemon connects to (a container actor's
  // channels), it gives the socket to them, mode 0600.
  uint32 daemon_uid = 18;
  uint32 daemon_gid = 19;
}

// An event observed inside the actor. The listener the guest calls is bound to
// its run, so the event names none.
message TraceEvent {
  int64 time_ms = 2;
  // The event kind, for example "fault.injected".
  string kind = 3;
  // The kind's payload: a JSON object whose schema is `needy_core::event`.
  string payload = 5;
  // The payload's schema version, `needy_core::event::SCHEMA_VERSION` of the
  // guest's build. The daemon refuses a version it does not read.
  uint32 version = 6;

  reserved 1, 4;
  reserved "session_id", "attrs";
}

message PushEventsRequest {
  TraceEvent event = 1;
}

message PushEventsResponse {}

message ReportExitRequest {
  optional int32 code = 1;
  string signal = 2;
}

message ReportExitResponse {}
